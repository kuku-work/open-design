    - label: 目標
      value: 遠距工作時維持專注時段，避免被手機打斷思路
    - label: 痛點
      value: 用手機計時會跳通知，一分心就很難再接回原本的思路
    - label: 使用社群
      value: Threads、YouTube、Reddit
  - name: 備考衝刺生 小昕
    title: 大學應屆考生／國考準備生
    person: 小昕，22歲
    narrative: '小昕大部分時間在圖書館自習室讀書，一天要輪流讀好幾個科目。

      拿手機計時容易被誤會在滑手機，她需要一個安靜、不用重設的方式切換讀書段落。

      '
    background:
    - label: 性別
      value: 女
    - label: 年紀
      value: 20-24
    - label: 居住地
      value: 台中
    - label: 家庭狀況
      value: 與家人同住
    - label: 教育程度
      value: 大學在學
    consumer:
