  pitches:
  - headline: 翻面，就開始衝刺
    product_name: ADAM FRIENDS 六面番茄鐘
    subtitle: 免設定，翻面即開始的深度工作夥伴
    concept: '不需要打開手機、不需要點開 App，翻到想要的那一面，倒數就開始跑。

      六面時間對應日常最常用的專注區段，適合番茄鐘式的短衝刺工作法。

      比起功能疊加，這裡只解決一件事：讓開始工作這個動作，不再需要多想一步。

      '
  - headline: 桌上的安靜儀式感
    product_name: ADAM FRIENDS 極簡計時方塊
    subtitle: USB-C 充電、靜音震動，桌面上的一顆呼吸感
    concept: '米白、岩灰、燕麥棕、霧霾藍，四款低彩度色，放進任何一張桌面都不突兀。

      充電線收起來後，桌上只留一顆安靜的方塊。

      它先是一件想擺在桌上的物件，然後才是一顆計時器。

      '
  - headline: 六個面，六種日常
    product_name: ADAM FRIENDS 多情境計時器
    subtitle: 讀書、健身、冥想，翻到哪一面就切換哪個模式
    concept: '讀書切一段、健身切一段、睡前冥想再切一段，六個面各自記得不同情境的時間，不必每次重新設定。

      三種提示模式讓它在圖書館、健身房、臥室都能安靜地待著。

      一顆方塊，跟著一天裡不同的自己走。

      '
