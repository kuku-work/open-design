  swot:
    strengths:
    - 翻轉即啟動，免按鍵設定
    - 六面各存一組常用時間
    - USB-C 充電，一年保固
    weaknesses:
    - 六面時間出廠固定，不可自訂
    - 無 App，無法回顧使用紀錄
    - 售價為機械式同類 3-5 倍
    opportunities:
    - 「深度工作」「番茄鐘」搜尋熱度持續成長
    - 混合辦公普及，桌面自律小物需求增加
    - 正念冥想族群需要非螢幕提示載具
    threats:
    - 手機內建計時器與免費 App 直接替代
    - 電商平台低價六面計時器加入戰局
    - 國際計時品牌持續在台擴張教育通路
  personas:
  - name: 深度工作者 阿哲
    title: 軟體工程師，接案／遠距工作為主
    person: 阿哲，29歲
    narrative: '阿哲大多時間在家或咖啡廳接案，靠自己排程沒有主管盯進度。

      他習慣用番茄鐘拆解任務，但手機計時常被通知打斷，反而更難進入狀態。

      '
