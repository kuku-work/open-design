      value: 讀書會、線上課程、文具收集、限時動態
    - label: 目標
      value: 用六面對應不同科目，切換讀書段落不必重新設定
    - label: 痛點
      value: 圖書館不能明著用手機計時，怕被當成在滑手機
    - label: 使用社群
      value: Instagram、Dcard、小紅書
  - name: 生活儀式感愛好者 Emily
    title: 行銷企劃，重視居家佈置
    person: Emily，34歲
    narrative: 'Emily 睡前習慣留一段安靜時間冥想或閱讀，不想被手機螢幕的光線打斷情緒。

      她願意為一件外型好看、放在桌上不突兀的小物多付一點錢。

      '
    background:
    - label: 性別
