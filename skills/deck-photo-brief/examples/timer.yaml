    - label: 目標
      value: 睡前用靜音震動提示做一段冥想或閱讀，不被鈴聲打擾
    - label: 痛點
      value: 一般鬧鐘聲音太吵，手機螢幕光線會影響睡前情緒
    - label: 使用社群
