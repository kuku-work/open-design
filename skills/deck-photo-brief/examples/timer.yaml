part2:
  chapter:
    index: 2
    zh: 設計風格提案
    en: STYLE PROPOSAL
  nav_sections:
  - Mood Board
  - 色彩故事
  - 排版方案
  brand:
    philosophy:
      steps:
      - 翻轉
      - 專注
      - 儀式
      - 日常
      tagline_en: Flip. Focus. Repeat.
      tagline_zh: 翻過去，就開始；用完，回到日常。
    naming:
      name: ADAM FRIENDS 六面計時器
      formula: ADAM（工程師的理性）＋ FRIENDS（六個面像六個陪伴角色）＝ 陪你切換每個時段的桌上朋友
      metaphors:
      - 六個面像六個朋友，各自記得你在那個時段該做的事
      - 翻轉不是操作，是跟朋友打個招呼、換一個場景
      - 不追求功能疊加，只做好陪伴這一件事
      slogan_zh: 翻過去，就開始。
      slogan_en: Flip it. Start it.
    identity:
      logotype: 六面體線稿商標，翻轉軌跡以極簡線條表現，呼應「翻轉即啟動」的核心動作
      identity: 低彩度四色（米白／岩灰／燕麥棕／霧霾藍）搭配霧面材質，識別語彙落在「安靜的桌面物件」而非「3C 產品」
      system: 圖標、包裝、官網統一使用同一組翻轉角度與圓角比例，讓六面計時器在任何通路都一眼可辨
      design_vocabulary: 霧面質地、45 度翻轉軸線、圓角矩形、低飽和四色階
    tagline: 翻過去，就開始。
  mood_boards:
  - code: A
    name: 沉浸衝刺
    concept: 深色木紋桌面、單一暖光源，畫面只留計時器與雙手，呼應番茄鐘式的短衝刺工作法
    keywords:
    - 專注
    - 暖光
    - 極簡
    linked_pitch: 0
    photo_style: 逆光剪影搭配單一暖色主光，景深壓縮到桌面與計時器，背景大幅虛化
    layout_style: 文案靠左下角落地，大量留白給桌面環境，資訊密度低、呼吸感優先
  - code: B
    name: 安靜物件
    concept: 米白背景、自然光、計時器單獨陳列，強調材質觸感與四色並置的物件美感
    keywords:
    - 質感
    - 留白
    - 陳列
    linked_pitch: 1
    photo_style: 平拍與 45 度側拍交替，柔和自然光，刻意保留陰影表現霧面材質
    layout_style: 置中構圖、對稱留白，文案採用細字重、大量負空間
  - code: C
    name: 情境切換
    concept: 三個場景（書桌、健身墊、床頭）並列，展示同一顆計時器在一天裡的六種切換
    keywords:
    - 日常
    - 多情境
    - 切換
    linked_pitch: 2
    photo_style: 三宮格式跨場景並列，每格光線與色溫依場景調整，維持計時器本身色彩一致
    layout_style: 網格式分區排版，每個場景配一小段情境文字，資訊密度中等
  color_index_lead: 四種顏色，四段一天裡會被重複播放的時刻。
  layout_options:
